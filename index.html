<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <link rel="icon" type="image/png" href="./icon.png">
  <link rel="apple-touch-icon" href="./icon.png">

  <title>MR Expense Tracker</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-container">
    
    <!-- Top Header & Theme Toggle Switch -->
    <header class="app-header">
      <h1>MR Expense Tracker</h1>
      
      <!-- Day/Night Pill Switch -->
      <button class="theme-toggle" id="themeToggle" onclick="toggleTheme()" aria-label="Toggle theme">
        <span class="toggle-slider"></span>
        <span class="toggle-text day-text">DAY MODE ☀️</span>
        <span class="toggle-text night-text">NIGHT MODE 🌙</span>
      </button>
    </header>

    <!-- PAGE 1: TOUR SELECTION / CREATION -->
    <main id="page1" class="card view-page active">
      <h2>Select or Create Tour</h2>
      
      <!-- Option 1: Select Previous -->
      <div class="form-group">
        <label for="tourSelect">Option 1: Choose Previous Tour</label>
        <select id="tourSelect" onchange="handleSelectTour()">
          <option value="">-- Select Existing Tour --</option>
        </select>
      </div>

      <div class="divider"><span>OR</span></div>

      <!-- Option 2: Create Unique New Tour -->
      <div class="form-group">
        <label for="newTourInput">Option 2: Create New Tour</label>
        <input type="text" id="newTourInput" placeholder="e.g., Mumbai Sales 2026" oninput="handleInputTour()">
        <span id="tourError" class="field-error"></span>
      </div>

      <button id="startTourBtn" class="btn btn-primary" onclick="proceedToPage2()">Proceed to Log Expenses &rarr;</button>
    </main>

    <!-- PAGE 2: EXPENSE LOGGING FORM -->
    <main id="page2" class="card view-page">
      <div class="page2-header">
        <button class="btn-back" onclick="goToPage1()">&larr; Change Tour</button>
        <h2 id="currentTourHeading" class="active-tour-heading">Tour Name</h2>
      </div>

      <!-- Date Selection -->
      <div class="form-group">
        <label for="expenseDate">Expense Date</label>
        <input type="date" id="expenseDate">
      </div>

      <!-- Expense Amounts -->
      <div class="section-title">Log Expenses</div>
      
      <div class="grid-inputs">
        <div class="form-group">
          <label for="bfAmount">Breakfast (₹)</label>
          <input type="number" id="bfAmount" min="0" placeholder="0">
        </div>

        <div class="form-group">
          <label for="lunchAmount">Lunch (₹)</label>
          <input type="number" id="lunchAmount" min="0" placeholder="0">
        </div>

        <div class="form-group">
          <label for="dinnerAmount">Dinner (₹)</label>
          <input type="number" id="dinnerAmount" min="0" placeholder="0">
        </div>

        <div class="form-group">
          <label for="stayAmount">Accommodation (₹)</label>
          <input type="number" id="stayAmount" min="0" placeholder="0">
        </div>
      </div>

      <!-- Travel Details & Toggle Buttons -->
      <div class="section-title">Travel Details</div>
      
      <div class="form-group">
        <label>Mode of Travel</label>
        <div class="travel-toggle-group" id="travelToggleGroup">
          <button type="button" class="toggle-btn active" data-mode="Train" onclick="selectTravelMode(this)">Train</button>
          <button type="button" class="toggle-btn" data-mode="Bus" onclick="selectTravelMode(this)">Bus</button>
          <button type="button" class="toggle-btn" data-mode="Auto / Cab" onclick="selectTravelMode(this)">Auto / Cab</button>
          <button type="button" class="toggle-btn" data-mode="Flight" onclick="selectTravelMode(this)">Flight</button>
          <button type="button" class="toggle-btn" data-mode="Other" onclick="selectTravelMode(this)">Other</button>
        </div>
      </div>

      <div class="form-group">
        <label for="travelAmount">Travel Expense (₹)</label>
        <input type="number" id="travelAmount" min="0" placeholder="0">
      </div>

      <!-- Action Buttons -->
      <div class="actions">
        <button id="submitBtn" class="btn btn-primary" onclick="submitExpense()">Save Expense</button>
        <button id="downloadBtn" class="btn btn-secondary" onclick="downloadExcel()">Download Excel Sheet</button>
      </div>

      <div id="statusMsg" class="status-message"></div>
    </main>

  </div>

  <script src="app.js"></script>
</body>
</html>

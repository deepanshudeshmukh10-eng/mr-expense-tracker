<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <link rel="icon" type="image/png" href="./icon.png">
  <link rel="apple-touch-icon" href="./icon.png">

  <title>MR Expense Tracker</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-container">

    <!-- PAGE 1: TOUR SELECTION -->
    <main id="page1" class="card active">
      <div class="card-header">
        <h2>📍 Select or Start Tour</h2>
      </div>

      <div class="form-group">
        <label for="tourSelect">Select Existing Tour</label>
        <select id="tourSelect" onchange="handleSelectTour()">
          <option value="">(Fetching tours...)</option>
        </select>
        <button class="btn btn-blue" onclick="proceedWithSelectedTour()">Continue with Selected Tour</button>
      </div>

      <div class="divider"><span>Or Start a New Tour</span></div>

      <div class="form-group">
        <input type="text" id="newTourInput" placeholder="e.g. Tour 1 - Jaipur" oninput="handleInputTour()">
        <span id="tourError" class="field-error"></span>
        <button class="btn btn-green" onclick="proceedWithNewTour()">Create New Tour</button>
      </div>
    </main>

    <!-- PAGE 2: EXPENSE LOGGING FORM -->
    <main id="page2" class="card">
      <div class="card-header center">
        <h2 id="currentTourHeading">📋 Tour Name</h2>
      </div>

      <!-- Date Input -->
      <div class="form-group">
        <label for="expenseDate">Date</label>
        <input type="date" id="expenseDate">
      </div>

      <!-- Location Input -->
      <div class="form-group">
        <label for="locationInput">Location / City</label>
        <input type="text" id="locationInput" placeholder="e.g. Jaipur Sector 5">
      </div>

      <!-- Expense Category Chips Grid -->
      <label class="section-label">Tap items to add expenses:</label>
      <div class="chip-grid">
        <button type="button" class="chip-btn" id="chip-bf" onclick="toggleCategory('bf')">🍳 Breakfast</button>
        <button type="button" class="chip-btn" id="chip-lunch" onclick="toggleCategory('lunch')">🥗 Lunch</button>
        <button type="button" class="chip-btn" id="chip-dinner" onclick="toggleCategory('dinner')">🍲 Dinner</button>
        <button type="button" class="chip-btn" id="chip-stay" onclick="toggleCategory('stay')">🏨 Accommodation</button>
        <button type="button" class="chip-btn full-width" id="chip-travel" onclick="toggleCategory('travel')">🚗 Travel</button>
      </div>

      <!-- Dynamic Inputs Section (Just below the chips) -->
      <div class="dynamic-inputs-container">
        <!-- Breakfast Input -->
        <div class="form-group category-input hidden" id="group-bf">
          <label for="bfAmount">Breakfast Amount (₹)</label>
          <input type="number" id="bfAmount" min="0" placeholder="0">
        </div>

        <!-- Lunch Input -->
        <div class="form-group category-input hidden" id="group-lunch">
          <label for="lunchAmount">Lunch Amount (₹)</label>
          <input type="number" id="lunchAmount" min="0" placeholder="0">
        </div>

        <!-- Dinner Input -->
        <div class="form-group category-input hidden" id="group-dinner">
          <label for="dinnerAmount">Dinner Amount (₹)</label>
          <input type="number" id="dinnerAmount" min="0" placeholder="0">
        </div>

        <!-- Accommodation Input -->
        <div class="form-group category-input hidden" id="group-stay">
          <label for="stayAmount">Accommodation Amount (₹)</label>
          <input type="number" id="stayAmount" min="0" placeholder="0">
        </div>

        <!-- Travel Modes Section -->
        <div class="travel-box hidden" id="group-travel">
          <div class="travel-box-title">🚌 Dedicated Travel Options:</div>
          
          <div class="form-group">
            <label for="trainAmount">🚆 Train Fare (₹)</label>
            <input type="number" id="trainAmount" min="0" placeholder="0">
          </div>

          <div class="form-group">
            <label for="busAmount">🚌 Bus Fare (₹)</label>
            <input type="number" id="busAmount" min="0" placeholder="0">
          </div>

          <div class="form-group">
            <label for="autoAmount">🛺 Auto / Taxi Fare (₹)</label>
            <input type="number" id="autoAmount" min="0" placeholder="0">
          </div>

          <div class="form-group">
            <label for="flightAmount">✈️ Flight Fare (₹)</label>
            <input type="number" id="flightAmount" min="0" placeholder="0">
          </div>

          <div class="form-group">
            <label for="otherTravelAmount">🛵 Other Travel (₹)</label>
            <input type="number" id="otherTravelAmount" min="0" placeholder="0">
          </div>
        </div>
      </div>

      <!-- Action Buttons -->
      <div class="actions">
        <button id="submitBtn" class="btn btn-save" onclick="submitExpense()">Save Entry</button>
        <button class="btn-link" onclick="goToPage1()">&larr; Change Tour</button>
      </div>

      <div id="statusMsg" class="status-message"></div>
    </main>

  </div>

  <script src="app.js"></script>
</body>
</html>
